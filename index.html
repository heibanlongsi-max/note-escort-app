<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>声だけでnote有料記事エスコート | NeuroCosmosLights</title>
<style>
  :root{
    --bg-deep:#0a0e1a;
    --bg-panel:#131a2e;
    --accent:#7dd3fc;
    --accent2:#c4b5fd;
    --gold:#fbbf24;
    --text:#e5e7eb;
    --text-dim:#94a3b8;
    --danger:#f87171;
    --ok:#4ade80;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(ellipse at top, #1a2240 0%, var(--bg-deep) 60%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    padding:0 0 60px;
  }
  .stars{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background-image:radial-gradient(1px 1px at 20% 30%, white, transparent),
                      radial-gradient(1px 1px at 70% 10%, white, transparent),
                      radial-gradient(1px 1px at 40% 80%, white, transparent),
                      radial-gradient(1px 1px at 90% 60%, white, transparent),
                      radial-gradient(1px 1px at 10% 90%, white, transparent);
    opacity:0.4;pointer-events:none;z-index:0;
  }
  header{
    text-align:center;padding:28px 16px 18px;position:relative;z-index:1;
  }
  header h1{
    font-size:19px;margin:0 0 6px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:700;
  }
  header p{color:var(--text-dim);font-size:12.5px;margin:0;}

  .progress-wrap{
    max-width:560px;margin:0 auto 18px;padding:0 16px;position:relative;z-index:1;
  }
  .progress-bar{
    height:6px;background:#1e293b;border-radius:99px;overflow:hidden;
  }
  .progress-fill{
    height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .4s ease;border-radius:99px;
  }
  .progress-label{
    text-align:center;font-size:12px;color:var(--text-dim);margin-top:6px;
  }

  .container{
    max-width:560px;margin:0 auto;padding:0 16px;position:relative;z-index:1;
  }
  .card{
    background:var(--bg-panel);
    border:1px solid #253150;
    border-radius:18px;
    padding:22px 18px;
    margin-bottom:16px;
    box-shadow:0 4px 24px rgba(0,0,0,0.3);
  }
  .step-badge{
    display:inline-block;font-size:11px;color:var(--accent);
    border:1px solid var(--accent);border-radius:99px;padding:3px 10px;margin-bottom:12px;
  }
  .step-title{font-size:16px;font-weight:700;margin:0 0 8px;line-height:1.5;}
  .step-hint{font-size:13px;color:var(--text-dim);line-height:1.7;margin:0 0 16px;}
  .step-hint b{color:var(--accent2);}

  textarea{
    width:100%;min-height:140px;background:#0d1424;border:1px solid #2c3a5c;
    border-radius:12px;color:var(--text);font-size:14.5px;line-height:1.8;
    padding:14px;resize:vertical;font-family:inherit;
  }
  textarea:focus{outline:none;border-color:var(--accent);}
  textarea::placeholder{color:#4b5878;}

  .char-count{text-align:right;font-size:11px;color:var(--text-dim);margin-top:6px;}

  .btn-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  button{
    border:none;border-radius:12px;padding:13px 18px;font-size:14px;font-weight:600;
    cursor:pointer;font-family:inherit;transition:transform .15s, opacity .15s;
  }
  button:active{transform:scale(0.97);}
  .btn-mic{
    background:linear-gradient(135deg,var(--accent),#3b82f6);color:#0a0e1a;flex:1;
    display:flex;align-items:center;justify-content:center;gap:8px;min-width:150px;
  }
  .btn-mic.recording{
    background:linear-gradient(135deg,var(--danger),#ef4444);
    animation:pulse 1.4s infinite;
  }
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,0.5);}50%{box-shadow:0 0 0 10px rgba(248,113,113,0);}}
  .btn-clear{background:#1e293b;color:var(--text-dim);}
  .btn-nav{
    background:#1e293b;color:var(--text);flex:1;
  }
  .btn-next{
    background:linear-gradient(135deg,var(--accent2),#8b5cf6);color:#0a0e1a;
  }
  .btn-copy{background:#1e293b;color:var(--accent2);font-size:12.5px;padding:9px 14px;}
  .btn-tts{background:#1e293b;color:var(--gold);font-size:12.5px;padding:9px 14px;}
  button:disabled{opacity:0.4;cursor:not-allowed;}

  .mic-status{font-size:12px;color:var(--accent);margin-top:8px;min-height:16px;text-align:center;}

  .dots{margin:18px 0;display:flex;justify-content:center;gap:6px;}
  .dot{width:7px;height:7px;border-radius:50%;background:#2c3a5c;}
  .dot.active{background:var(--accent);}
  .dot.done{background:var(--accent2);}

  .final-block{margin-bottom:18px;}
  .final-block h3{font-size:13px;color:var(--accent);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;}
  .final-block pre{
    background:#0d1424;border:1px solid #2c3a5c;border-radius:12px;padding:14px;
    white-space:pre-wrap;word-wrap:break-word;font-size:13px;line-height:1.8;color:var(--text);
    margin:0 0 8px;max-height:220px;overflow-y:auto;font-family:inherit;
  }
  .hashtag-input{width:100%;background:#0d1424;border:1px solid #2c3a5c;border-radius:10px;
    color:var(--text);padding:10px 12px;font-size:13.5px;margin-bottom:8px;}

  .save-note{
    text-align:center;font-size:11.5px;color:var(--text-dim);margin-top:14px;
  }
  .warn{
    background:#1f1a10;border:1px solid #4a3a10;color:#fbbf24;font-size:12.5px;
    border-radius:10px;padding:10px 12px;margin-bottom:14px;line-height:1.6;
  }
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--accent2);color:#0a0e1a;padding:10px 20px;border-radius:99px;
    font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:10;
  }
  .toast.show{opacity:1;}
  footer{text-align:center;color:#4b5878;font-size:11px;margin-top:30px;}
</style>
</head>
<body>
<div class="stars"></div>

<header>
  <h1>声だけでnote有料記事エスコート</h1>
  <p>7つのステップで、話すだけで有料記事の骨組みを作ります</p>
</header>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">ステップ 1 / 7</div>
</div>

<div class="container" id="wizard"></div>

<div class="container" id="finalScreen" style="display:none;"></div>

<footer>NeuroCosmosLights — 声とAIで、無理なく発信する</footer>
<div class="toast" id="toast"></div>

<script>
const STEPS = [
  {
    key: "feeling",
    badge: "STEP 1 / 7",
    title: "① 今日の読者の気持ちを、一言二言だけ声にする",
    hint: "書き始める前に、この記事を読む人が今どんな気持ちでいるか、<b>短く1〜2フレーズだけ</b>話してください。「ミスを繰り返してつらいと思っている人」のような一言でOKです。長く話さなくて大丈夫です。",
    placeholder: "例：同じミスを繰り返して自分を責めている人"
  },
  {
    key: "title",
    badge: "STEP 2 / 7",
    title: "② タイトル案を声で出す",
    hint: "読者の気持ちを踏まえて、記事のタイトル案を思いつくまま話してください。複数出しても大丈夫です。あとで一番良いものを選べます。",
    placeholder: "例：同じミスを繰り返してしまうのをどう減らせるか"
  },
  {
    key: "free1",
    badge: "STEP 3 / 7",
    title: "③ 無料パート①：悩みを掘り下げる",
    hint: "読者が抱えている悩みや状況を、自分の体験も交えながら話してください。ここは<b>購入を決めるための材料</b>になる部分です。",
    placeholder: "例：私自身、何度も同じミスをして落ち込んだことがあります…"
  },
  {
    key: "free2",
    badge: "STEP 4 / 7",
    title: "④ 無料パート②：解決の方向性を示す",
    hint: "その悩みに対して、どんな考え方・方向性で向き合えばいいかを話してください。<b>具体的な手順はまだ出さず</b>、方向性だけを示すのがポイントです。",
    placeholder: "例：仕組みを変えるだけで、意外と減らせることに気づきました…"
  },
  {
    key: "paid",
    badge: "STEP 5 / 7",
    title: "⑤ 有料パート：具体的な行動ステップ",
    hint: "ここが購入者だけに見せる本編です。具体的に何をすればいいか、手順やコツを話してください。読者がそのまま真似できるレベルまで具体的に。",
    placeholder: "例：まず1つ目にやったのは…次に…"
  },
  {
    key: "cta",
    badge: "STEP 6 / 7",
    title: "⑥ まとめ・行動喚起（CTA）",
    hint: "記事の最後に、読者に何をしてほしいか（フォロー、次の記事へ、コメントなど）を話してください。",
    placeholder: "例：今日話したことを、まず1つだけ試してみてください"
  }
];

let currentStep = 0;
const answers = {};
STEPS.forEach(s => answers[s.key] = "");
let hashtags = "#note #副業 #音声入力 #有料記事 #発達特性 #ASD #ADHD";

// ---- Web Speech API setup ----
let recognition = null;
let isRecording = false;
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRec) {
  recognition = new SpeechRec();
  recognition.lang = "ja-JP";
  recognition.continuous = true;
  recognition.interimResults = true;
}

function loadSaved(){
  try{
    const raw = localStorage.getItem("noteEscortDraft");
    if(raw){
      const data = JSON.parse(raw);
      Object.assign(answers, data.answers || {});
      hashtags = data.hashtags || hashtags;
      currentStep = data.currentStep || 0;
    }
  }catch(e){}
}
function saveDraft(){
  try{
    localStorage.setItem("noteEscortDraft", JSON.stringify({answers, hashtags, currentStep}));
  }catch(e){}
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1800);
}

function renderProgress(){
  const total = STEPS.length + 1;
  const pos = Math.min(currentStep+1, total);
  document.getElementById("progressFill").style.width = (pos/total*100)+"%";
  document.getElementById("progressLabel").textContent =
    currentStep < STEPS.length ? `ステップ ${currentStep+1} / 7` : `最終チェック`;
}

function renderStep(){
  if(currentStep >= STEPS.length){
    renderFinal();
    return;
  }
  document.getElementById("finalScreen").style.display = "none";
  const wizard = document.getElementById("wizard");
  wizard.style.display = "block";
  const s = STEPS[currentStep];
  renderProgress();

  const dots = STEPS.map((_,i)=>{
    const cls = i < currentStep ? "dot done" : (i === currentStep ? "dot active" : "dot");
    return `<div class="${cls}"></div>`;
  }).join("");

  wizard.innerHTML = `
    <div class="card">
      <span class="step-badge">${s.badge}</span>
      <p class="step-title">${s.title}</p>
      <p class="step-hint">${s.hint}</p>
      ${!SpeechRec ? '<div class="warn">この端末・ブラウザは音声入力に対応していない可能性があります。下の欄に直接キーボードで入力してください（iPhoneはSafari推奨）。</div>' : ''}
      <textarea id="answerBox" placeholder="${s.placeholder}">${answers[s.key]}</textarea>
      <div class="char-count"><span id="charCount">${answers[s.key].length}</span>文字</div>
      <div class="mic-status" id="micStatus">&nbsp;</div>
      <div class="btn-row">
        <button class="btn-mic" id="micBtn">🎙️ 話して入力</button>
        <button class="btn-clear" id="clearBtn">クリア</button>
      </div>
      <div class="btn-row">
        <button class="btn-nav" id="backBtn" ${currentStep===0?"disabled":""}>← 戻る</button>
        <button class="btn-next" id="nextBtn">${currentStep===STEPS.length-1 ? "最終チェックへ →" : "次へ →"}</button>
      </div>
    </div>
    <div class="dots">${dots}</div>
  `;

  const box = document.getElementById("answerBox");
  box.addEventListener("input", ()=>{
    answers[s.key] = box.value;
    document.getElementById("charCount").textContent = box.value.length;
    saveDraft();
  });

  document.getElementById("clearBtn").onclick = ()=>{
    box.value = "";
    answers[s.key] = "";
    document.getElementById("charCount").textContent = 0;
    saveDraft();
  };
  document.getElementById("backBtn").onclick = ()=>{
    stopRecording();
    currentStep--;
    saveDraft();
    renderStep();
  };
  document.getElementById("nextBtn").onclick = ()=>{
    stopRecording();
    currentStep++;
    saveDraft();
    renderStep();
  };

  const micBtn = document.getElementById("micBtn");
  const micStatus = document.getElementById("micStatus");
  micBtn.onclick = ()=>{
    if(!SpeechRec){
      showToast("この端末では音声入力が使えません");
      return;
    }
    if(isRecording){
      stopRecording();
      return;
    }
    startRecording(box, micBtn, micStatus, s.key);
  };
}

function startRecording(box, micBtn, micStatus, key){
  try{
    recognition.onresult = (e)=>{
      let finalText = "";
      for(let i = e.resultIndex; i < e.results.length; i++){
        if(e.results[i].isFinal){
          finalText += e.results[i][0].transcript;
        }
      }
      if(finalText){
        box.value = box.value + finalText;
        answers[key] = box.value;
        document.getElementById("charCount").textContent = box.value.length;
        saveDraft();
      }
    };
    recognition.onerror = (e)=>{
      micStatus.textContent = "エラーが発生しました。もう一度お試しください。";
      stopRecording();
    };
    recognition.onend = ()=>{
      if(isRecording){
        try{ recognition.start(); }catch(e){}
      }
    };
    recognition.start();
    isRecording = true;
    micBtn.classList.add("recording");
    micBtn.textContent = "⏹️ 停止する";
    micStatus.textContent = "聞き取り中…話し終えたら「停止する」を押してください";
  }catch(e){
    showToast("音声入力を開始できませんでした");
  }
}
function stopRecording(){
  if(recognition && isRecording){
    isRecording = false;
    try{ recognition.stop(); }catch(e){}
  }
  const micBtn = document.getElementById("micBtn");
  const micStatus = document.getElementById("micStatus");
  if(micBtn){
    micBtn.classList.remove("recording");
    micBtn.textContent = "🎙️ 話して入力";
  }
  if(micStatus) micStatus.textContent = "\u00a0";
}

function renderFinal(){
  document.getElementById("wizard").style.display = "none";
  const el = document.getElementById("finalScreen");
  el.style.display = "block";
  renderProgress();

  el.innerHTML = `
    <div class="card">
      <p class="step-title">⑦ 最終チェック：全文を確認して読み上げる</p>
      <p class="step-hint">各ブロックをそのままnoteにコピペできます。貼る前に、<b>特に有料パートの共感部分</b>は必ず自分の言葉で見直してください。「読み上げ」ボタンで耳からもチェックできます。</p>

      <div class="final-block">
        <h3>タイトル案 <button class="btn-copy" onclick="copyBlock('titleOut')">コピー</button></h3>
        <pre id="titleOut">${escapeHtml(answers.title)}</pre>
      </div>

      <div class="final-block">
        <h3>無料パート① <button class="btn-copy" onclick="copyBlock('free1Out')">コピー</button></h3>
        <pre id="free1Out">${escapeHtml(answers.feeling + (answers.feeling?"\n\n":"") + answers.free1)}</pre>
      </div>

      <div class="final-block">
        <h3>無料パート② <button class="btn-copy" onclick="copyBlock('free2Out')">コピー</button></h3>
        <pre id="free2Out">${escapeHtml(answers.free2)}</pre>
      </div>

      <div class="final-block">
        <h3>ハッシュタグ</h3>
        <input class="hashtag-input" id="hashtagInput" value="${escapeHtml(hashtags)}">
        <button class="btn-copy" onclick="copyHashtags()">コピー</button>
      </div>

      <div class="final-block">
        <h3>有料パート（――ここから有料エリアです――） <button class="btn-copy" onclick="copyBlock('paidOut')">コピー</button></h3>
        <pre id="paidOut">${escapeHtml("――――― ここから有料エリアです ―――――\n\n" + answers.paid + "\n\n" + answers.cta)}</pre>
      </div>

      <div class="btn-row">
        <button class="btn-tts" id="ttsBtn" style="flex:1;">🔊 全文を読み上げてチェック</button>
      </div>
      <div class="btn-row">
        <button class="btn-nav" onclick="backToEdit()">← ステップを見直す</button>
        <button class="btn-clear" onclick="resetAll()">最初からやり直す</button>
      </div>
      <p class="save-note">入力内容はこの端末に自動保存されています。閉じても続きから再開できます。</p>
    </div>
  `;

  document.getElementById("hashtagInput").addEventListener("input", (e)=>{
    hashtags = e.target.value;
    saveDraft();
  });

  document.getElementById("ttsBtn").onclick = ()=>{
    readAloudAll();
  };
}

function escapeHtml(str){
  return (str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function copyBlock(id){
  const text = document.getElementById(id).textContent;
  navigator.clipboard.writeText(text).then(()=>showToast("コピーしました")).catch(()=>showToast("コピーに失敗しました"));
}
function copyHashtags(){
  navigator.clipboard.writeText(document.getElementById("hashtagInput").value)
    .then(()=>showToast("コピーしました")).catch(()=>showToast("コピーに失敗しました"));
}

function readAloudAll(){
  if(!("speechSynthesis" in window)){
    showToast("この端末では読み上げに対応していません");
    return;
  }
  window.speechSynthesis.cancel();
  const fullText = [
    answers.title, answers.feeling, answers.free1, answers.free2, answers.paid, answers.cta
  ].filter(Boolean).join("。 ");
  const utter = new SpeechSynthesisUtterance(fullText);
  utter.lang = "ja-JP";
  utter.rate = 1.0;
  window.speechSynthesis.speak(utter);
  showToast("読み上げを開始します");
}

function backToEdit(){
  currentStep = STEPS.length - 1;
  saveDraft();
  renderStep();
}
function resetAll(){
  if(!confirm("入力した内容をすべて消去します。よろしいですか？")){
    return;
  }
  STEPS.forEach(s => answers[s.key] = "");
  currentStep = 0;
  saveDraft();
  renderStep();
}

// init
loadSaved();
renderStep();
</script>
</body>
</html>
